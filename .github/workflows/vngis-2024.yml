name: VNGISDash 2024 (ngày trước, đêm sau)

# The former mixed day/night runner is retired. Both entry points use the batch gate.
on:
  workflow_dispatch:
    inputs:
      step:
        description: "Kiểm kê hoặc xử lý một giai đoạn; phần đêm bị chặn nếu ngày chưa đủ"
        type: choice
        options: [inventory, day, night]
        default: inventory

permissions:
  actions: write
  contents: read

jobs:
  batch:
    uses: ./.github/workflows/vngis-batch.yml
    with:
      step: ${{ inputs.step }}
      compare: "0"
    secrets: inherit
