name: VNGISDash 2024 (chạy nối lượt)

# Mỗi lượt chạy tối đa ~5 giờ 15 phút rồi tự gọi lượt kế tiếp cho đến khi mọi xã xong.
# Trạng thái nằm trên Google Drive nên lượt sau tiếp tục đúng chỗ dừng.
#
# Không cần chọn tỉnh, xã.
# mode = pilot: tự lấy pilot_n xã (xen kẽ phường, xã; mặc định 2), ghi vào VNGISDash_2024_PILOT và tự kiểm tra bằng verify_pilot.py.
# mode = full : chạy toàn bộ xã, ghi vào VNGISDash_2024.
# Dừng: tạo file STOP ở thư mục gốc repo, hoặc file _control/STOP trong thư mục trên Drive.
# Luôn bấm "Run workflow". Không dùng "Re-run all jobs" (nút đó chạy lại với input cũ).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pilot = thí điểm 2 xã | full = toàn bộ xã"
        type: choice
        options: [pilot, full]
        default: pilot
      pilot_n:
        description: "Số xã thí điểm (chỉ dùng khi mode = pilot)"
        required: false
        default: "2"
      workers:
        description: "Số xã xử lý song song"
        required: false
        default: "8"

concurrency:
  group: vngis-2024
  cancel-in-progress: false

permissions:
  actions: write     # để lượt này gọi lượt kế tiếp
  contents: read     # để kiểm tra file STOP

env:
  VNGIS_MODE: ${{ inputs.mode }}
  VNGIS_PILOT_N: ${{ inputs.pilot_n }}
  # Thí điểm ghi vào thư mục riêng, không lẫn dữ liệu thật
  VNGIS_DRIVE_FOLDER: ${{ inputs.mode == 'full' && 'VNGISDash_2024' || 'VNGISDash_2024_PILOT' }}
  VNGIS_RCLONE_REMOTE: gdrive

jobs:
  gate:
    name: Kiểm tra file STOP
    runs-on: ubuntu-latest
    outputs:
      stop: ${{ steps.chk.outputs.stop }}
    steps:
      - uses: actions/checkout@v4
      - id: chk
        run: |
          if [ -f STOP ]; then
            echo "stop=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Có file STOP ở repo: không chạy lượt này."
          else
            echo "stop=false" >> "$GITHUB_OUTPUT"
          fi

  run:
    name: Chạy một lượt
    needs: gate
    if: needs.gate.outputs.stop != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      VNGIS_UPLOAD_EVERY_SEC: "300"
      VNGIS_MAX_RUNTIME_SEC: "18900"
      VNGIS_EE_HIGH_VOLUME: "false"
      VNGIS_DAY_BANDS: "6"            # 6 = BLUE..SWIR2 | 10 = thêm NDVI, NDBI, MNDWI, BSI (file lớn gần gấp đôi)
      VNGIS_DAY_SCALE: "10000"        # 10000: sai số 0,00005 | 1000: file nhỏ thêm ~40%, sai số 0,0005
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"

      # Giữ nguyên thư viện đã cài giữa các lượt: lượt sau bỏ qua bước cài (tiết kiệm ~30-60 giây)
      - name: Cache thư viện Python và rclone
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            ~/venv
            ~/bin/rclone
          key: deps-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}-rclone1

      - name: Cài thư viện và rclone (chỉ khi chưa có cache)
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/venv
          ~/venv/bin/pip install -q -r requirements.txt
          mkdir -p ~/bin && cd /tmp
          curl -fsSL -o rclone.zip https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q rclone.zip && cp rclone-*-linux-amd64/rclone ~/bin/ && chmod +x ~/bin/rclone

      - name: Đưa venv và rclone vào PATH
        run: |
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Cache ranh giới GADM
        uses: actions/cache@v4
        with:
          path: ~/vngis_2024/_cache
          key: gadm41-vnm-v1

      - name: Ghi khóa truy cập từ Secrets
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONF }}
          EE_KEY_DATA: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
        run: |
          [ -n "$RCLONE_CONF_DATA" ] || { echo "::error::Thiếu secret RCLONE_CONF"; exit 1; }
          [ -n "$EE_KEY_DATA" ] || { echo "::error::Thiếu secret EE_SERVICE_ACCOUNT_JSON"; exit 1; }
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONF_DATA" > "$HOME/.config/rclone/rclone.conf"
          printf '%s' "$EE_KEY_DATA" > "$RUNNER_TEMP/ee-key.json"
          chmod 600 "$HOME/.config/rclone/rclone.conf" "$RUNNER_TEMP/ee-key.json"
          echo "Thư mục đích trên Drive: $VNGIS_DRIVE_FOLDER"

      - name: Chạy pipeline
        id: pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          VNGIS_EE_KEY_FILE: ${{ runner.temp }}/ee-key.json
          VNGIS_RUN_ID: ${{ github.run_id }}
          VNGIS_WORKERS: ${{ inputs.workers }}
          STOP_POLL_SEC: "300"
        run: |
          set +e
          python -u vngis_2024.py &
          PID=$!
          (
            while kill -0 "$PID" 2>/dev/null; do
              for _ in $(seq 1 "$STOP_POLL_SEC"); do
                sleep 1
                kill -0 "$PID" 2>/dev/null || exit 0
              done
              if gh api "repos/${GITHUB_REPOSITORY}/contents/STOP" > /dev/null 2>&1; then
                echo "::notice::Phát hiện file STOP: dừng trật tự."
                kill -TERM "$PID" 2>/dev/null
                exit 0
              fi
            done
          ) &
          WATCH=$!
          wait "$PID"
          code=$?
          kill "$WATCH" 2>/dev/null
          wait "$WATCH" 2>/dev/null
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Script thoát với mã $code"
          exit 0

      - name: Đồng bộ nốt lên Drive (luôn chạy)
        if: always()
        continue-on-error: true
        run: python vngis_2024.py --sync-only

      - name: Kiểm tra kết quả thí điểm
        if: always() && inputs.mode == 'pilot' && steps.pipeline.outputs.code == '0'
        continue-on-error: true
        run: |
          python verify_pilot.py --remote "${VNGIS_RCLONE_REMOTE}:${VNGIS_DRIVE_FOLDER}" \
            --report "$RUNNER_TEMP/verify_report.md"
          cat "$RUNNER_TEMP/verify_report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Tóm tắt tiến độ
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, pandas as pd
          p = os.path.expanduser(f"~/vngis_2024/{os.environ['VNGIS_DRIVE_FOLDER']}/_control/progress.csv")
          if os.path.isfile(p):
              d = pd.read_csv(p)
              print(f"### Tiến độ ({os.environ['VNGIS_DRIVE_FOLDER']})\n")
              print(f"Tổng {len(d):,} xã: {d['status'].value_counts().to_dict()}\n")
              bad = d[d['status'] != 'done'].head(15)
              if len(bad):
                  print("| GID_3 | trạng thái | lỗi |\n|---|---|---|")
                  for r in bad.itertuples():
                      print(f"| {r.GID_3} | {r.status} | {str(r.errors)[:150]} |")
          PY

      - name: Nối lượt kế tiếp
        if: steps.pipeline.outputs.code == '3' || steps.pipeline.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/contents/STOP" > /dev/null 2>&1; then
            echo "::notice::Có file STOP: dừng chuỗi, không nối lượt."
          else
            gh workflow run vngis-2024.yml --ref "$GITHUB_REF_NAME" \
              -f mode="${{ inputs.mode }}" -f pilot_n="${{ inputs.pilot_n }}" -f workers="${{ inputs.workers }}"
            echo "Đã gọi lượt kế tiếp."
          fi

      - name: Báo lỗi nếu script thoát bất thường
        if: >-
          always() && steps.pipeline.outputs.code != '' &&
          steps.pipeline.outputs.code != '0' && steps.pipeline.outputs.code != '2' &&
          steps.pipeline.outputs.code != '3' && steps.pipeline.outputs.code != '130'
        run: |
          echo "::error::Script thoát với mã ${{ steps.pipeline.outputs.code }}. Mở bước 'Chạy pipeline', tìm các dòng [preflight] hoặc ERROR."
          exit 1
