name: VNGISDash 2024 v6 (ngày trước, đêm sau)

# Mỗi lượt chạy tối đa ~5 giờ 15 phút rồi tự gọi lượt kế tiếp cho đến khi mọi xã xong.
# Trạng thái nằm trên Google Drive nên lượt sau tiếp tục đúng chỗ dừng.
#
# Không cần chọn tỉnh, xã.
# mode = pilot: tự lấy pilot_n xã (xen kẽ phường, xã; mặc định 2), ghi vào VNGISDash_2024_PILOT và tự kiểm tra bằng verify_pilot.py.
# mode = full : chạy toàn bộ xã, ghi vào VNGISDash_2024.
# Dừng: tạo file STOP ở thư mục gốc repo, hoặc file _control/STOP trong thư mục trên Drive.
# Luôn bấm "Run workflow". Không dùng "Re-run all jobs" (nút đó chạy lại với input cũ).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "pilot = thí điểm 2 xã | full = toàn bộ xã"
        type: choice
        options: [pilot, full]
        default: pilot
      pilot_n:
        description: "Số xã thí điểm (chỉ dùng khi mode = pilot)"
        required: false
        default: "2"
      workers:
        description: "Số xã xử lý song song"
        required: false
        default: "2"

      step:
        description: "inventory = kiểm kê | run = ngày rồi đêm khi ngày đủ"
        type: choice
        options: [inventory, run]
        default: inventory
      month_threads:
        description: "Số tháng tải song song trong mỗi xã"
        default: "2"
      ee_concurrency:
        description: "Giới hạn chung request EE và tải ảnh đang chạy"
        default: "4"
      ee_qps:
        description: "Tốc độ bắt đầu request EE và tải ảnh/giây"
        default: "2"
      drive_transfers:
        description: "Số file rclone truyền song song"
        default: "2"
      drive_tps:
        description: "Tốc độ request Drive/giây trong rclone"
        default: "2"
      retry_failed:
        description: "Thử lại xã đã hết giới hạn sau khi xử lý nguyên nhân lỗi"
        type: boolean
        default: false

concurrency:
  group: vngis-2024
  cancel-in-progress: false

permissions:
  actions: write     # để lượt này gọi lượt kế tiếp
  contents: read     # để kiểm tra file STOP

env:
  VNGIS_MODE: ${{ inputs.mode }}
  VNGIS_STEP: ${{ inputs.step }}
  VNGIS_WORKERS: ${{ inputs.workers }}
  VNGIS_PILOT_N: ${{ inputs.pilot_n }}
  # Thí điểm ghi vào thư mục riêng, không lẫn dữ liệu thật
  VNGIS_DRIVE_FOLDER: ${{ inputs.mode == 'full' && 'VNGISDash_2024' || 'VNGISDash_2024_PILOT' }}
  VNGIS_RCLONE_REMOTE: gdrive
  VNGIS_MONTH_THREADS: ${{ inputs.month_threads }}
  VNGIS_EE_CONCURRENCY: ${{ inputs.ee_concurrency }}
  VNGIS_EE_QPS: ${{ inputs.ee_qps }}
  VNGIS_RCLONE_TRANSFERS: ${{ inputs.drive_transfers }}
  VNGIS_RCLONE_CHECKERS: "4"
  VNGIS_RCLONE_TPSLIMIT: ${{ inputs.drive_tps }}
  VNGIS_RCLONE_TPSLIMIT_BURST: "2"
  VNGIS_RETRY_FAILED: ${{ inputs.retry_failed }}
  VNGIS_EE_PROJECT: vngis-ee-2
  VNGIS_EE_ASSET: projects/vngis-ee-2/assets/communes_l3
  VNGIS_REQUEST_ATTEMPTS: "6"
  VNGIS_MAX_ATTEMPTS: "3"
  VNGIS_MIN_FREE_GB: "6"

jobs:
  gate:
    name: Kiểm tra file STOP
    runs-on: ubuntu-latest
    outputs:
      stop: ${{ steps.chk.outputs.stop }}
    steps:
      - uses: actions/checkout@v4
      - id: chk
        run: |
          if [ -f STOP ]; then
            echo "stop=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Có file STOP ở repo: không chạy lượt này."
          else
            echo "stop=false" >> "$GITHUB_OUTPUT"
          fi

  run:
    name: Chạy một lượt
    needs: gate
    if: needs.gate.outputs.stop != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      VNGIS_UPLOAD_EVERY_SEC: "300"
      VNGIS_MAX_RUNTIME_SEC: "18900"
      VNGIS_EE_HIGH_VOLUME: "false"
      # Dung lượng ảnh ngày (xem HUONG_DAN.md mục "Dung lượng ảnh ngày")
      VNGIS_DAY_FORMAT: "float"       # float = như bản 4, không mất dữ liệu | int16 = nhỏ hơn ~3-4 lần
      VNGIS_DAY_BANDS: "10"           # 10 = đủ như notebook | 6 = chỉ BLUE..SWIR2, nhỏ hơn ~40%
      VNGIS_DAY_SCALE: "10000"        # chỉ dùng khi int16: 10000 (sai số 0,00005) | 1000 (nhỏ thêm ~40%)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.11"

      # Giữ nguyên thư viện đã cài giữa các lượt: lượt sau bỏ qua bước cài (tiết kiệm ~30-60 giây)
      - name: Cache thư viện Python và rclone
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            ~/venv
            ~/bin/rclone
          key: deps-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}-v6r-rclone-apt

      - name: Cài thư viện và rclone (chỉ khi chưa có cache)
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/venv
          ~/venv/bin/pip install -q -r requirements.txt
          # Dùng gói Ubuntu với xác minh chữ ký APT, không tải zip current không kiểm chứng.
          sudo apt-get update
          sudo apt-get install -y rclone
          mkdir -p ~/bin
          cp /usr/bin/rclone ~/bin/rclone
          chmod +x ~/bin/rclone

      - name: Đưa venv và rclone vào PATH
        run: |
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Cache ranh giới GADM
        uses: actions/cache@v4
        with:
          path: ~/vngis_2024/_cache
          key: gadm41-vnm-v1

      - name: Ghi khóa truy cập từ Secrets
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONF }}
          EE_KEY_DATA: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
        run: |
          [ -n "$RCLONE_CONF_DATA" ] || { echo "::error::Thiếu secret RCLONE_CONF"; exit 1; }
          if [ "$VNGIS_STEP" = run ] && [ -z "$EE_KEY_DATA" ]; then
            echo "::error::Thiếu secret EE_SERVICE_ACCOUNT_JSON cho step=run"
            exit 1
          fi
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONF_DATA" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          if [ -n "$EE_KEY_DATA" ]; then
            printf '%s' "$EE_KEY_DATA" > "$RUNNER_TEMP/ee-key.json"
            chmod 600 "$RUNNER_TEMP/ee-key.json"
          fi
          echo "Thư mục đích trên Drive: $VNGIS_DRIVE_FOLDER"

      - name: Kiểm thử offline trước khi chạy
        run: python -m unittest discover -s tests -v

      - name: Chạy pipeline
        id: pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          VNGIS_EE_KEY_FILE: ${{ runner.temp }}/ee-key.json
          VNGIS_RUN_ID: ${{ github.run_id }}
          VNGIS_WORKERS: ${{ inputs.workers }}
          STOP_POLL_SEC: "300"
        run: |
          set +e
          python -u vngis_2024.py "$VNGIS_STEP" &
          PID=$!
          (
            while kill -0 "$PID" 2>/dev/null; do
              for _ in $(seq 1 "$STOP_POLL_SEC"); do
                sleep 1
                kill -0 "$PID" 2>/dev/null || exit 0
              done
              if gh api "repos/${GITHUB_REPOSITORY}/contents/STOP" > /dev/null 2>&1; then
                echo "::notice::Phát hiện file STOP: dừng trật tự."
                kill -TERM "$PID" 2>/dev/null
                exit 0
              fi
            done
          ) &
          WATCH=$!
          wait "$PID"
          code=$?
          kill "$WATCH" 2>/dev/null
          wait "$WATCH" 2>/dev/null
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Script thoát với mã $code"
          exit 0

      - name: Đồng bộ nốt lên Drive (luôn chạy)
        if: always()
        run: python vngis_2024.py --sync-only

      - name: Kiểm tra kết quả thí điểm
        if: inputs.mode == 'pilot' && inputs.step == 'run' && steps.pipeline.outputs.code == '0'
        run: |
          python verify_pilot.py --remote "${VNGIS_RCLONE_REMOTE}:${VNGIS_DRIVE_FOLDER}" \
            --report "$RUNNER_TEMP/verify_report.md"
          cat "$RUNNER_TEMP/verify_report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Tóm tắt tiến độ
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os, pandas as pd
          p = os.path.expanduser(f"~/vngis_2024/{os.environ['VNGIS_DRIVE_FOLDER']}/_control/progress.csv")
          if os.path.isfile(p):
              d = pd.read_csv(p)
              print(f"### Tiến độ ({os.environ['VNGIS_DRIVE_FOLDER']})\n")
              print(f"Tổng {d['gid_3'].nunique():,} xã, {len(d):,} xã–tháng\n")
              for field in ('day_image', 'day_indices', 'night_image', 'night_indices'):
                  print(f"- {field}: {d[field].value_counts().to_dict()}")
          PY

      - name: Nối lượt kế tiếp
        if: steps.pipeline.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/contents/STOP" > /dev/null 2>&1; then
            echo "::notice::Có file STOP: dừng chuỗi, không nối lượt."
          else
            gh workflow run vngis-2024.yml --ref "$GITHUB_REF_NAME" \
              -f mode="$VNGIS_MODE" -f pilot_n="$VNGIS_PILOT_N" -f workers="$VNGIS_WORKERS" \
              -f step="$VNGIS_STEP" -f month_threads="$VNGIS_MONTH_THREADS" \
              -f ee_concurrency="$VNGIS_EE_CONCURRENCY" -f ee_qps="$VNGIS_EE_QPS" \
              -f drive_transfers="$VNGIS_RCLONE_TRANSFERS" \
              -f drive_tps="$VNGIS_RCLONE_TPSLIMIT" -f retry_failed=false
            echo "Đã gọi lượt kế tiếp."
          fi

      - name: Báo lỗi nếu script thoát bất thường
        if: >-
          always() && steps.pipeline.outputs.code != '' &&
          steps.pipeline.outputs.code != '0' &&
          steps.pipeline.outputs.code != '3' && steps.pipeline.outputs.code != '130'
        run: |
          echo "::error::Script thoát với mã ${{ steps.pipeline.outputs.code }}. Mở bước 'Chạy pipeline', tìm các dòng [preflight] hoặc ERROR."
          exit 1
